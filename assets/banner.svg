<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#161a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- eyebrow -->
  <text x="70" y="66" font-family="Arial, sans-serif" font-size="13" letter-spacing="4" fill="#818cf8" font-weight="600">WEEK 04 · SEMANTIC SEARCH &amp; VECTOR RETRIEVAL</text>

  <!-- title -->
  <text x="68" y="126" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#f1f5f9">AI Knowledge Assistant</text>

  <rect x="70" y="148" width="190" height="4" rx="2" fill="url(#accent)"/>

  <!-- subtitle -->
  <text x="70" y="186" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Search by meaning, not keywords — grounded answers powered by RAG.</text>

  <!-- feature row -->
  <g font-family="'Courier New', monospace" font-size="12.5" fill="#cbd5e1">
    <text x="70" y="228">Embeddings</text>
    <circle cx="180" cy="224" r="2" fill="#818cf8" opacity="0.6"/>
    <text x="195" y="228">Vector DB</text>
    <circle cx="290" cy="224" r="2" fill="#818cf8" opacity="0.6"/>
    <text x="305" y="228">Semantic Retrieval</text>
    <circle cx="460" cy="224" r="2" fill="#818cf8" opacity="0.6"/>
    <text x="475" y="228">RAG</text>
  </g>

  <!-- simple clean icon, right side — a radar/target style search mark -->
  <g transform="translate(1000, 95)">
    <rect x="0" y="0" width="100" height="110" rx="8" fill="#f1f5f9" opacity="0.04" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="42" cy="42" r="20" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <circle cx="42" cy="42" r="9" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
    <circle cx="42" cy="42" r="2.5" fill="#818cf8"/>
    <line x1="57" y1="57" x2="76" y2="76" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect x="0" y="298" width="1200" height="2" fill="url(#accent)" opacity="0.5"/>
</svg>
